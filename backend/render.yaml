services:
  - type: web
    name: hrms-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn hrms_core.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: hrms-postgres
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://hrms-frontend.vercel.app"

databases:
  - name: hrms-postgres
    databaseName: hrms_db
    user: hrms_user
